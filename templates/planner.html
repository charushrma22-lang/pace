
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner | PACE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #171321;
            color: #f5f1ff;
            padding: 35px;
        }

        .planner-container {
            max-width: 1000px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa1bd;
        }

        a {
            color: #c5a8ff;
            text-decoration: none;
        }

        .panel {
            background: #211b30;
            border: 1px solid #393047;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #453a58;
            background: #171321;
            color: white;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 75px;
            grid-column: 1 / -1;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #b794f6;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .add-btn {
            background: #b794f6;
            color: #21172f;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #cbb2ff;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 17px;
            background: #2a233a;
            border: 1px solid #403650;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-info h3 {
            font-size: 16px;
            margin-bottom: 7px;
        }

        .task-info p {
            color: #aaa1bd;
            font-size: 13px;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .task-meta {
            color: #c5a8ff;
            font-size: 12px;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-actions button {
            padding: 9px 12px;
            font-size: 12px;
        }

        .edit-btn {
            background: #493b63;
            color: white;
        }

        .delete-btn {
            background: #633444;
            color: #ffdce5;
        }

        .task-item.completed h3 {
            text-decoration: line-through;
            color: #9b91a9;
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-checkbox {
            width: 19px;
            height: 19px;
            accent-color: #b794f6;
            cursor: pointer;
        }

        .empty-state {
            color: #aaa1bd;
            text-align: center;
            padding: 30px 10px;
        }

        .message {
            color: #ffaaaa;
            margin-top: 12px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            body {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            textarea {
                grid-column: auto;
            }

            .task-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="planner-container">

        <div class="top-bar">
            <div>
                <h1>Daily Planner</h1>
                <p class="subtitle">Plan your day, one task at a time.</p>
            </div>
            <a href="/">← Back to Dashboard</a>
        </div>

        <section class="panel">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <div class="form-grid">
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="What do you need to do?"
                        required
                    >

                    <input
                        type="date"
                        id="taskDate"
                    >

                    <textarea
                        id="taskDescription"
                        placeholder="Add a description (optional)"
                    ></textarea>

                    <select id="taskPriority">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>

                <button type="submit" class="add-btn">+ Add Task</button>
                <p id="formMessage" class="message"></p>
            </form>
        </section>

        <section class="panel">
            <h2>My Tasks</h2>
            <div id="taskList">
                <p class="empty-state">Loading your tasks...</p>
            </div>
        </section>

    </main>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskList = document.getElementById("taskList");
        const formMessage = document.getElementById("formMessage");

        async function loadTasks() {
            try {
                const response = await fetch("/api/tasks");

                if (!response.ok) {
                    throw new Error("Could not load tasks");
                }

                const tasks = await response.json();
                renderTasks(tasks);

            } catch (error) {
                taskList.innerHTML =
                    '<p class="empty-state">Could not load tasks. Please refresh the page.</p>';
            }
        }

        function renderTasks(tasks) {
            taskList.innerHTML = "";

            if (tasks.length === 0) {
                taskList.innerHTML =
                    '<p class="empty-state">No tasks yet. Add your first task above!</p>';
                return;
            }

            tasks.forEach(task => {
                const item = document.createElement("div");
                item.className = "task-item";

                if (task.completed) {
                    item.classList.add("completed");
                }

                const info = document.createElement("div");
                info.className = "task-info";

                const title = document.createElement("h3");
                title.textContent = task.title;

                const description = document.createElement("p");
                description.textContent = task.description || "No description";

                const meta = document.createElement("div");
                meta.className = "task-meta";

                const dueDate = task.due_date || "No due date";
                meta.textContent = `${task.priority} Priority • ${dueDate}`;

                info.append(title, description, meta);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.title = "Mark task as complete";

                checkbox.addEventListener("change", async () => {
                    await updateTask(task.id, {
                        completed: checkbox.checked
                    });
                });

                const editButton = document.createElement("button");
                editButton.className = "edit-btn";
                editButton.textContent = "Edit";

                editButton.addEventListener("click", () => editTask(task));

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", () => deleteTask(task.id));

                actions.append(checkbox, editButton, deleteButton);
                item.append(info, actions);
                taskList.appendChild(item);
            });
        }

        taskForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const task = {
                title: document.getElementById("taskTitle").value.trim(),
                description: document.getElementById("taskDescription").value.trim(),
                due_date: document.getElementById("taskDate").value || null,
                priority: document.getElementById("taskPriority").value
            };

            if (!task.title) return;

            try {
                const response = await fetch("/api/tasks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(task)
                });

                if (!response.ok) {
                    throw new Error("Could not add task");
                }

                taskForm.reset();
                document.getElementById("taskPriority").value = "Medium";
                formMessage.textContent = "";
                await loadTasks();

            } catch (error) {
                formMessage.textContent = "Could not add task. Please try again.";
            }
        });

        async function updateTask(id, changes) {
            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(changes)
                });

                if (!response.ok) {
                    throw new Error("Update failed");
                }

                await loadTasks();

            } catch (error) {
                alert("Could not update this task.");
                await loadTasks();
            }
        }

        async function editTask(task) {
            const title = prompt("Edit task title:", task.title);
            if (title === null) return;

            if (!title.trim()) {
                alert("Task title cannot be empty.");
                return;
            }

            const description = prompt(
                "Edit description:",
                task.description || ""
            );
            if (description === null) return;

            const priority = prompt(
                "Enter priority: Low, Medium, or High",
                task.priority
            );
            if (priority === null) return;

            const validPriority = ["Low", "Medium", "High"];

            if (!validPriority.includes(priority.trim())) {
                alert("Please enter Low, Medium, or High.");
                return;
            }

            const dueDate = prompt(
                "Enter due date (YYYY-MM-DD), or leave empty:",
                task.due_date || ""
            );
            if (dueDate === null) return;

            await updateTask(task.id, {
                title: title.trim(),
                description: description.trim(),
                priority: priority.trim(),
                due_date: dueDate.trim() || null
            });
        }

        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) {
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                await loadTasks();

            } catch (error) {
                alert("Could not delete this task.");
            }
        }

        loadTasks();
    </script>
</body>
</html>
