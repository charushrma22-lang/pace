
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE | Calendar</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .calendar-page {
            max-width: 1100px;
            margin: 35px auto;
            padding: 25px;
            color: #f4efff;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .calendar-header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .calendar-header p {
            color: #aaa0bd;
        }

        .calendar-card, .events-card {
            background: #211b30;
            border: 1px solid #39304b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .month-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .month-controls h2 {
            font-size: 21px;
        }

        .month-controls button {
            background: #352a49;
            color: white;
            border: 1px solid #514267;
            border-radius: 9px;
            padding: 9px 14px;
            cursor: pointer;
        }

        .month-controls button:hover {
            background: #8061b5;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday {
            text-align: center;
            color: #b9a9d4;
            font-size: 13px;
            padding: 10px 0;
        }

        .calendar-day {
            min-height: 85px;
            padding: 10px;
            border-radius: 11px;
            background: #2b243a;
            border: 1px solid transparent;
            color: #eee7fa;
            cursor: pointer;
            text-align: left;
            position: relative;
        }

        .calendar-day:hover {
            border-color: #a78bfa;
            background: #382d4b;
        }

        .calendar-day.empty {
            background: transparent;
            cursor: default;
        }

        .calendar-day.today {
            border-color: #b69af8;
            background: #403153;
        }

        .calendar-day.selected {
            border: 2px solid #c4a9ff;
            background: #49375f;
        }

        .day-number {
            font-weight: 600;
        }

        .event-dot {
            display: block;
            width: 7px;
            height: 7px;
            background: #c4a9ff;
            border-radius: 50%;
            margin-top: 10px;
        }

        .events-card h2 {
            margin-bottom: 6px;
        }

        .selected-date {
            color: #b9a9d4;
            margin-bottom: 18px;
        }

        .event-item {
            background: #302740;
            border: 1px solid #493b5c;
            padding: 13px 15px;
            border-radius: 11px;
            margin-bottom: 10px;
        }

        .event-item p {
            color: #b9a9d4;
            font-size: 13px;
            margin-top: 5px;
        }

        .empty-message {
            color: #aaa0bd;
            padding: 15px 0;
        }

        .calendar-note {
            color: #aaa0bd;
            font-size: 13px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .calendar-page {
                padding: 12px;
                margin: 15px auto;
            }

            .calendar-card, .events-card {
                padding: 12px;
            }

            .calendar-day {
                min-height: 60px;
                padding: 6px;
                font-size: 13px;
            }

            .calendar-grid {
                gap: 4px;
            }

            .weekday {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <main class="calendar-page">

        <header class="calendar-header">
            <div>
                <h1>My Calendar</h1>
                <p>Keep track of your plans and deadlines.</p>
            </div>
            <a href="/" style="color:#c4a9ff; text-decoration:none;">
                ← Back to Dashboard
            </a>
        </header>

        <section class="calendar-card">
            <div class="month-controls">
                <button id="previous-month">←</button>
                <h2 id="month-title">Loading...</h2>
                <button id="next-month">→</button>
            </div>

            <div class="calendar-grid" id="calendar-grid"></div>

            <p class="calendar-note">
                Purple dots indicate dates with scheduled tasks.
            </p>
        </section>

        <section class="events-card">
            <h2>Selected Date</h2>
            <p class="selected-date" id="selected-date"></p>
            <div id="events-list">
                <p class="empty-message">Loading tasks...</p>
            </div>
        </section>

    </main>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let tasks = [];

        const calendarGrid = document.getElementById("calendar-grid");
        const monthTitle = document.getElementById("month-title");
        const selectedDateText = document.getElementById("selected-date");
        const eventsList = document.getElementById("events-list");

        function dateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function renderCalendar() {
            calendarGrid.innerHTML = "";

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthTitle.textContent = currentDate.toLocaleDateString(
                "en-US",
                { month: "long", year: "numeric" }
            );

            const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            weekdays.forEach(day => {
                const heading = document.createElement("div");
                heading.className = "weekday";
                heading.textContent = day;
                calendarGrid.appendChild(heading);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement("div");
                empty.className = "calendar-day empty";
                calendarGrid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const key = dateKey(date);

                const cell = document.createElement("button");
                cell.className = "calendar-day";
                cell.type = "button";

                if (key === dateKey(new Date())) {
                    cell.classList.add("today");
                }

                if (key === dateKey(selectedDate)) {
                    cell.classList.add("selected");
                }

                const number = document.createElement("span");
                number.className = "day-number";
                number.textContent = day;
                cell.appendChild(number);

                if (tasks.some(task => task.due_date === key)) {
                    const dot = document.createElement("span");
                    dot.className = "event-dot";
                    cell.appendChild(dot);
                }

                cell.addEventListener("click", () => {
                    selectedDate = date;
                    renderCalendar();
                    renderSelectedDate();
                });

                calendarGrid.appendChild(cell);
            }
        }

        function renderSelectedDate() {
            const key = dateKey(selectedDate);

            selectedDateText.textContent = selectedDate.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

            const selectedTasks = tasks.filter(task => task.due_date === key);

            eventsList.innerHTML = "";

            if (selectedTasks.length === 0) {
                eventsList.innerHTML =
                    '<p class="empty-message">No tasks scheduled for this date.</p>';
                return;
            }

            selectedTasks.forEach(task => {
                const item = document.createElement("div");
                item.className = "event-item";

                const title = document.createElement("strong");
                title.textContent = task.title;

                const details = document.createElement("p");
                details.textContent =
                    `${task.priority || "Medium"} priority · ` +
                    (task.completed ? "Completed" : "Pending");

                item.appendChild(title);
                item.appendChild(details);
                eventsList.appendChild(item);
            });
        }

        async function loadTasks() {
            try {
                const response = await fetch("/api/tasks");

                if (!response.ok) {
                    throw new Error("Could not load tasks");
                }

                tasks = await response.json();
                renderCalendar();
                renderSelectedDate();

            } catch (error) {
                eventsList.textContent = "Unable to load tasks. Please refresh the page.";
                console.error(error);
            }
        }

        document.getElementById("previous-month").addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById("next-month").addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        loadTasks();
    </script>
</body>
</html>
