
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PACE</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .profile-page {
            padding: 30px;
        }

        .profile-card {
            max-width: 650px;
            margin-top: 25px;
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: var(--primary);
            color: #171123;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .profile-info {
            margin-top: 25px;
        }

        .profile-info p {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .profile-info strong {
            display: inline-block;
            width: 110px;
            color: var(--primary-light);
        }

        .profile-back {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-light);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="profile-page">

        <h1>My Profile</h1>
        <p>Your PACE account information</p>

        <div class="profile-card">

            <div class="profile-avatar">
                {{ current_user.username[0]|upper }}
            </div>

            <h2>{{ current_user.username }}</h2>
            <p>PACE Member</p>

            <div class="profile-info">
                <p>
                    <strong>Username</strong>
                    {{ current_user.username }}
                </p>

                <p>
                    <strong>Email</strong>
                    {{ current_user.email }}
                </p>
            </div>

            <a href="{{ url_for('home') }}" class="profile-back">
                ← Back to Dashboard
            </a>

        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
