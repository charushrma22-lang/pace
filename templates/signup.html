
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PACE</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #100d18;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #1b1727;
            border: 1px solid #30283f;
            border-radius: 18px;
        }

        .auth-card h1 {
            color: #c4b5fd;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: #aaa0bd;
            margin-bottom: 25px;
        }

        .auth-card input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #403650;
            border-radius: 8px;
            background: #100d18;
            color: white;
            box-sizing: border-box;
        }

        .auth-card button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #a78bfa;
            color: #171123;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-card a {
            color: #c4b5fd;
        }

        .auth-message {
            color: #fca5a5;
            margin-bottom: 15px;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            color: #aaa0bd;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <h1>Join PACE</h1>
        <p>Create your account and start building better habits.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="auth-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </div>

    </div>

</body>
</html>
