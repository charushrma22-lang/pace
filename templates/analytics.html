
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | PACE</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #171321;
            color: #f4efff;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 25px;
        }

        .back-link {
            color: #c4a8ff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa0bd;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card, .chart-card {
            background: #241e32;
            border: 1px solid #393047;
            border-radius: 17px;
            padding: 23px;
        }

        .stat-card p {
            color: #aaa0bd;
            font-size: 14px;
            margin-bottom: 13px;
        }

        .stat-card h2 {
            color: #c4a8ff;
            font-size: 30px;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-card h3 {
            margin-bottom: 22px;
            font-size: 18px;
        }

        .chart-container {
            position: relative;
            height: 260px;
        }

        .message {
            color: #aaa0bd;
            margin-top: 20px;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 450px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="/" class="back-link">← Back to Dashboard</a>

        <h1>Your Analytics</h1>
        <p class="subtitle">
            Track your progress and celebrate your consistency.
        </p>

        <section class="stats">

            <div class="stat-card">
                <p>Total Habits</p>
                <h2 id="totalHabits">0</h2>
            </div>

            <div class="stat-card">
                <p>Habit Completions</p>
                <h2 id="habitCompletions">0</h2>
            </div>

            <div class="stat-card">
                <p>Tasks Completed</p>
                <h2 id="tasksCompleted">0</h2>
            </div>

            <div class="stat-card">
                <p>Focus Minutes</p>
                <h2 id="focusMinutes">0</h2>
            </div>

        </section>

        <section class="charts">

            <div class="chart-card">
                <h3>Weekly Habit Progress</h3>
                <div class="chart-container">
                    <canvas id="habitChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Task Overview</h3>
                <div class="chart-container">
                    <canvas id="taskChart"></canvas>
                </div>
            </div>

        </section>

        <p class="message" id="statusMessage">Loading your analytics...</p>

    </main>

<script>
    async function loadAnalytics() {
        try {
            const response = await fetch("/api/analytics");

            if (!response.ok) {
                throw new Error("Could not load analytics");
            }

            const data = await response.json();

            // Update statistics
            document.getElementById("totalHabits").textContent =
                data.total_habits;

            document.getElementById("habitCompletions").textContent =
                data.habit_completions;

            document.getElementById("tasksCompleted").textContent =
                data.tasks_completed;

            document.getElementById("focusMinutes").textContent =
                data.focus_minutes;

            // Weekly habit chart
            new Chart(document.getElementById("habitChart"), {
                type: "bar",
                data: {
                    labels: data.weekly_progress.map(item => item.day),
                    datasets: [{
                        label: "Completed Habits",
                        data: data.weekly_progress.map(item => item.completed),
                        backgroundColor: "#a88be0",
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: "#f4efff" }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#aaa0bd" },
                            grid: { display: false }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: "#aaa0bd",
                                precision: 0
                            },
                            grid: { color: "#393047" }
                        }
                    }
                }
            });

            // Task completion chart
            new Chart(document.getElementById("taskChart"), {
                type: "doughnut",
                data: {
                    labels: ["Completed", "Pending"],
                    datasets: [{
                        data: [
                            data.tasks_completed,
                            data.total_tasks - data.tasks_completed
                        ],
                        backgroundColor: ["#a88be0", "#514365"],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: "bottom",
                            labels: { color: "#f4efff" }
                        }
                    }
                }
            });

            document.getElementById("statusMessage").textContent =
                "Your latest progress is up to date.";

        } catch (error) {
            console.error(error);

            document.getElementById("statusMessage").textContent =
                "Could not load analytics. Please refresh the page.";
        }
    }

    loadAnalytics();
</script>
</body>
</html>

</body>
</html>
