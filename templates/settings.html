
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | PACE</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .settings-page {
            padding: 30px;
        }

        .settings-card {
            max-width: 700px;
            margin-top: 25px;
            padding: 25px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .settings-section {
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
        }

        .settings-section:last-child {
            border-bottom: none;
        }

        .settings-section h3 {
            margin-bottom: 8px;
        }

        .settings-section p {
            color: var(--text-muted, #aaa);
            margin-bottom: 12px;
        }

        .settings-button {
            padding: 10px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-hover);
            color: var(--primary-light);
            cursor: pointer;
        }

        .settings-back {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-light);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="settings-page">

        <h1>Settings</h1>
        <p>Manage your PACE preferences</p>

        <div class="settings-card">

            <div class="settings-section">
                <h3>Account</h3>
                <p>View your account information.</p>
                <a href="{{ url_for('profile') }}">
                    <button class="settings-button">View Profile</button>
                </a>
            </div>

            <div class="settings-section">
                <h3>Appearance</h3>
                <p>PACE currently uses its dark purple theme.</p>
            </div>

            <div class="settings-section">
                <h3>Privacy</h3>
                <p>Your password is stored securely using password hashing.</p>
            </div>

            <div class="settings-section">
                <h3>Session</h3>
                <p>Sign out of your PACE account.</p>
                <a href="{{ url_for('logout') }}">
                    <button class="settings-button">Logout</button>
                </a>
            </div>

        </div>

        <a href="{{ url_for('home') }}" class="settings-back">
            ← Back to Dashboard
        </a>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
